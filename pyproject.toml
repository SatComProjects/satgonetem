[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "satgonetem"
version = "0.2.2"
description = "SatGoNetem - Satellite Network Emulation Tool"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPLv3"}
authors = [
    {name = "Juan Arias Suarez", email = "juan.arias-suarez@isae-supaero.fr"},
    {name = "Louis Barbier", email = "louis.barbier@isae-supaero.fr"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: System :: Networking",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "docker>=7.1.0",
    "grpcio>=1.62.0",
    "matplotlib>=3.10.0",
    "networkx>=3.4.0",
    "numpy>=2.2.0",
    "Pillow>=11.2.0",
    "protobuf>=6.31.0",
    "PyYAML>=6.0.0",
    "sgp4>=2.23",
    "uvicorn[standard]>=0.29.0",
    "jinja2>=3.1.0",
    "fastapi>=0.110.0",
    "python-multipart>=0.0.9",
    "psutil>=7.0.0",
    "pandas>=2.3.0",
    "astropy>=6.1.7",
    "pyroute2>=0.7.0",
    "yaspin>=3.0.0",
    "sat_com_topology @ git+https://github.com/SatComProjects/satComTopology.git@v5.0.3",
    "igraph>=1.0.0",
    "itur>=0.4.0",
]

[project.optional-dependencies]
extra = [
    "itur>=0.4.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "flake8>=6.0",
    "mypy>=1.0",
    "ruff==0.17.6",
]

[project.urls]
Homepage = "https://github.com/SatComProjects/"
Documentation = "https://github.com/SatComProjects/satgonetem/docs"
Repository = "https://github.com/SatComProjects/satgonetem"
Issues = "https://github.com/SatComProjects/satgonetem/issues"

[tool.setuptools]
packages = ["satgonetem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast, deterministic unit tests",
    "integration: requires Docker, root, network, or another external service",
    "slow: takes substantially longer than a unit test",
    "benchmark: performance or scale benchmark",
]

[tool.coverage.run]
source = ["satgonetem"]
omit = [
    "satgonetem/proto/*",
    "*/__pycache__/*",
]

[tool.coverage.report]
fail_under = 62
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.10"
files = [
    "satgonetem/models",
    "satgonetem/addressing",
    "satgonetem/link_budget",
]
ignore_missing_imports = true
warn_unused_configs = true

[tool.ruff]
target-version = "py310"
# Generated protobuf modules are produced by protoc and are not hand-edited.
exclude = [
    "satgonetem/proto/netem_pb2.py",
    "satgonetem/proto/netem_pb2_grpc.py",
]

[tool.ruff.lint]
# Ratchet: this is the enforced subset. Widen it as findings are fixed; never
# narrow it to make a change pass. Spec 0008 tracks the remaining rules.
select = ["E4", "E7", "E9", "F401", "F63", "F7", "F811", "F82", "F841", "I"]

[tool.ruff.lint.per-file-ignores]
# apply_satcom_fix() must run before the sat_com imports below it, so the import
# block is intentionally not at the top of the file.
"satgonetem/services/topology_satcom.py" = ["E402"]

[tool.uv]
required-version = ">=0.11.0"
